<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="OLIFLIX">
  <defs>
    <linearGradient id="chrome-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8f4ff"/>
      <stop offset="25%"  stop-color="#b8d4f0"/>
      <stop offset="50%"  stop-color="#ffffff"/>
      <stop offset="75%"  stop-color="#8ab4d8"/>
      <stop offset="100%" stop-color="#4a6d9c"/>
    </linearGradient>
    <linearGradient id="sunset-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff2d78"/>
      <stop offset="40%"  stop-color="#ff6b1a"/>
      <stop offset="70%"  stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow-chrome" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.5
                0 0 0 0 0.7
                0 0 0 0 1
                0 0 0 0.6 0" result="glow-blue"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feColorMatrix in="blur2" type="matrix"
        values="1 0 0 0 1
                0 0 0 0 0.17
                0 0 0 0 0.47
                0 0 0 0.3 0" result="glow-pink"/>
      <feMerge>
        <feMergeNode in="glow-blue"/>
        <feMergeNode in="glow-pink"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Bevel shadow layer (offset, darker) -->
  <text
    x="240" y="92"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="88"
    font-weight="900"
    letter-spacing="4"
    fill="#1a2d4a"
    transform="translate(3,3)"
    style="font-stretch: condensed;"
  >OLIFLIX</text>

  <!-- Sunset edge bevel layer -->
  <text
    x="240" y="92"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="88"
    font-weight="900"
    letter-spacing="4"
    fill="url(#sunset-edge)"
    transform="translate(2,2)"
    style="font-stretch: condensed;"
  >OLIFLIX</text>

  <!-- Main chrome fill with glow -->
  <text
    x="240" y="92"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="88"
    font-weight="900"
    letter-spacing="4"
    fill="url(#chrome-fill)"
    filter="url(#glow-chrome)"
    style="font-stretch: condensed;"
  >OLIFLIX</text>

  <!-- Lens flare sparkles -->
  <g filter="url(#sparkle)" opacity="0.9">
    <!-- Top-left sparkle -->
    <line x1="28" y1="10" x2="28" y2="30" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="18" y1="20" x2="38" y2="20" stroke="white" stroke-width="1.5" opacity="0.9"/>
    <line x1="21" y1="13" x2="35" y2="27" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <line x1="35" y1="13" x2="21" y2="27" stroke="white" stroke-width="0.8" opacity="0.6"/>
    <circle cx="28" cy="20" r="2" fill="white" opacity="0.95"/>

    <!-- Top-right sparkle -->
    <line x1="452" y1="8"  x2="452" y2="24" stroke="white" stroke-width="1.2" opacity="0.8"/>
    <line x1="444" y1="16" x2="460" y2="16" stroke="white" stroke-width="1.2" opacity="0.8"/>
    <circle cx="452" cy="16" r="1.5" fill="white" opacity="0.9"/>
  </g>
</svg>
